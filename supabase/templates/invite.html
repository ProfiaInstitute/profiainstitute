<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Profia Institute invitation</title>
  </head>
  <body
    style="
      margin: 0;
      background: #f6f3ee;
      font-family: Arial, Helvetica, sans-serif;
      color: #282525;
    "
  >
    <table
      role="presentation"
      width="100%"
      cellspacing="0"
      cellpadding="0"
      style="background: #f6f3ee; padding: 32px 12px"
    >
      <tr>
        <td align="center">
          <table
            role="presentation"
            width="600"
            cellspacing="0"
            cellpadding="0"
            style="
              max-width: 600px;
              width: 100%;
              background: #fff;
              border: 1px solid #e8e1dc;
              border-radius: 12px;
              overflow: hidden;
            "
          >
            <tr>
              <td align="center" style="padding: 28px 24px 20px; border-bottom: 4px solid #e56b32">
                <a href="https://www.profiainstitute.com"
                  ><img
                    src="https://www.profiainstitute.com/_next/static/media/logo.0114ddc1.png"
                    width="150"
                    alt="Profia Institute"
                    style="display: block; width: 150px; height: auto; border: 0"
                /></a>
              </td>
            </tr>
            <tr>
              <td style="padding: 32px">
                <h1 style="margin: 0 0 16px; color: #680915; font-size: 24px">You are invited</h1>
                <p style="font-size: 16px; line-height: 1.6">
                  You have been invited to join Profia Institute’s online system. Accept the
                  invitation to set up your account.
                </p>
                <p style="margin: 26px 0">
                  <a
                    href="{{ .ConfirmationURL }}"
                    style="
                      display: inline-block;
                      background: #680915;
                      color: #fff;
                      text-decoration: none;
                      font-weight: bold;
                      padding: 14px 24px;
                      border-radius: 6px;
                    "
                    >Accept invitation</a
                  >
                </p>
                <p style="font-size: 13px; line-height: 1.6; color: #625b58">
                  If you were not expecting this invitation, you can ignore this message.
                </p>
              </td>
            </tr>
            <tr>
              <td
                align="center"
                style="
                  padding: 18px 24px;
                  background: #680915;
                  color: #fff;
                  font-size: 12px;
                  line-height: 1.6;
                "
              >
                Profia Institute · Homa Bay, Kenya<br /><a
                  href="https://www.profiainstitute.com"
                  style="color: #fff"
                  >www.profiainstitute.com</a
                >
              </td>
            </tr>
          </table>
        </td>
      </tr>
    </table>
  </body>
</html>
